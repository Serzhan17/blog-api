<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="930" viewBox="0 0 1220 930"><rect width="1220" height="930" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172b4d} .edge{fill:none;stroke:#64748b;stroke-width:2}</style><path class="edge" d="M210 255 V430 H450"/><text x="235" y="415" font-size="15">1 → 0..* posts</text><path class="edge" d="M620 180 V330"/><text x="630" y="280" font-size="15">0..1 → 0..*</text><path class="edge" d="M1010 180 V650"/><text x="1025" y="450" font-size="15">1 → 0..*</text><path class="edge" d="M790 470 H880 V650"/><text x="890" y="570" font-size="15">1 → 0..*</text><path class="edge" d="M450 480 H390 V720 H370"/><text x="220" y="580" font-size="15">1 → 0..* comments</text><path class="edge" d="M130 255 V650"/><text x="140" y="535" font-size="15">1 → 0..* comments</text><rect x="30" y="45" width="340" height="210" rx="8" fill="#f8fafc" stroke="#334155"/><text x="45" y="75" font-size="20" font-weight="bold">User</text><text x="45" y="107" font-size="15">id: PK</text><text x="45" y="132" font-size="15">email: unique</text><text x="45" y="157" font-size="15">first_name, last_name, date_joined</text><text x="45" y="182" font-size="15">password (hashed), last_login</text><text x="45" y="207" font-size="15">is_active, is_staff, is_superuser</text><text x="45" y="232" font-size="15">groups, user_permissions (inherited)</text><rect x="450" y="45" width="340" height="135" rx="8" fill="#f8fafc" stroke="#334155"/><text x="465" y="75" font-size="20" font-weight="bold">Category</text><text x="465" y="107" font-size="15">id: PK</text><text x="465" y="132" font-size="15">name: unique</text><text x="465" y="157" font-size="15">slug: unique</text><rect x="840" y="45" width="340" height="135" rx="8" fill="#f8fafc" stroke="#334155"/><text x="855" y="75" font-size="20" font-weight="bold">Tag</text><text x="855" y="107" font-size="15">id: PK</text><text x="855" y="132" font-size="15">name: unique</text><text x="855" y="157" font-size="15">slug: unique</text><rect x="450" y="330" width="340" height="210" rx="8" fill="#f8fafc" stroke="#334155"/><text x="465" y="360" font-size="20" font-weight="bold">Post</text><text x="465" y="392" font-size="15">id: PK</text><text x="465" y="417" font-size="15">author_id: FK User (CASCADE)</text><text x="465" y="442" font-size="15">category_id: FK Category (SET_NULL)</text><text x="465" y="467" font-size="15">title, body; slug: unique</text><text x="465" y="492" font-size="15">status: draft / published</text><text x="465" y="517" font-size="15">created_at, updated_at</text><rect x="30" y="650" width="340" height="160" rx="8" fill="#f8fafc" stroke="#334155"/><text x="45" y="680" font-size="20" font-weight="bold">Comment</text><text x="45" y="712" font-size="15">id: PK</text><text x="45" y="737" font-size="15">post_id: FK Post (CASCADE)</text><text x="45" y="762" font-size="15">author_id: FK User (CASCADE)</text><text x="45" y="787" font-size="15">body, created_at</text><rect x="840" y="650" width="340" height="160" rx="8" fill="#f8fafc" stroke="#334155"/><text x="855" y="680" font-size="20" font-weight="bold">Post_tags (automatic)</text><text x="855" y="712" font-size="15">id: PK</text><text x="855" y="737" font-size="15">post_id: FK Post</text><text x="855" y="762" font-size="15">tag_id: FK Tag</text><text x="855" y="787" font-size="15">unique (post_id, tag_id)</text><text x="30" y="900" font-size="16">Blog API — Homework 1 | Each post has 0–many tags; a category is optional.</text></svg>
